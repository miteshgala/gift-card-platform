# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — GiftCard Platform (Development / Docker Compose)
#
# In production, replace this with a managed load balancer (ALB, Cloud Run, etc.)
# and enforce TLS termination + mTLS to the vault upstream.
#
# Listening ports:
#   80   → admin frontend (React SPA)
#   8080 → cardholder portal (React SPA)
#   8090 → API gateway (all /api/* routes)
#
# For local development, use the Vite dev servers instead (ports 3000 / 3001).
# This config is used in the Docker Compose stack with the built frontends.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length    1024;

    # ── Security headers (applied globally) ───────────────────────────────────
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upstream definitions ───────────────────────────────────────────────────
    upstream api {
        server api:4000;
        keepalive 32;
    }

    upstream admin_frontend {
        server admin:80;
        keepalive 8;
    }

    upstream cardholder_frontend {
        server cardholder:80;
        keepalive 8;
    }

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=20r/m;

    # ────────────────────────────────────────────────────────────────────────────
    # Server: Admin Frontend  →  port 80
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Block dot-files
        location ~ /\. { deny all; }

        # API proxy — admin SPA sends /api/* directly to the API
        location /api/ {
            limit_req zone=global burst=20 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # Auth endpoints — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # Admin SPA — serve from built container
        location / {
            proxy_pass         http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }

    # ────────────────────────────────────────────────────────────────────────────
    # Server: Cardholder Portal  →  port 8080
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        location ~ /\. { deny all; }

        location /api/ {
            limit_req zone=global burst=10 nodelay;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location /api/v1/cardholder/auth {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location / {
            proxy_pass         http://cardholder_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }

    # ────────────────────────────────────────────────────────────────────────────
    # Server: API direct access  →  port 8090
    # (For CI, internal tooling, and health checks)
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 8090;
        server_name _;

        location /health/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }
    }
}
