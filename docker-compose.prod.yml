# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Secrets must be provided via environment variables or a secrets manager.
# Never commit a populated .env file — use .env.example as the template.

version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: giftcard_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No external port exposure in production — only reachable by backend
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: giftcard_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Database migration runner ───────────────────────────────────────────────
  # Runs once on startup, then exits. Backend waits for it to complete.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: giftcard_migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    networks:
      - internal

  # ─── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: giftcard_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      MAX_PIN_ATTEMPTS: ${MAX_PIN_ATTEMPTS:-5}
      DEFAULT_CARD_EXPIRY_DAYS: ${DEFAULT_CARD_EXPIRY_DAYS:-365}
      SANDBOX_KEY_PREFIX: ${SANDBOX_KEY_PREFIX:-sk_test_}
      LIVE_KEY_PREFIX: ${LIVE_KEY_PREFIX:-sk_live_}
      KYC_THRESHOLD: ${KYC_THRESHOLD:-1000}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health/live || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
      replicas: 1

  # ─── Frontend (nginx serving static SPA + proxying /api) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api/v1     # relative — nginx proxies to backend
    container_name: giftcard_frontend_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-80}:80'
      - '${FRONTEND_HTTPS_PORT:-443}:443'
    volumes:
      - ./ssl:/etc/nginx/ssl:ro        # mount TLS certs (managed externally)
      - nginx_cache:/var/cache/nginx
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  internal:
    driver: bridge
