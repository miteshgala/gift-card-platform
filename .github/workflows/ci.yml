name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Shared env used by multiple jobs ──────────────────────────────────────────
env:
  NODE_VERSION: '22'

jobs:
  # ─── API: typecheck + unit tests + build ─────────────────────────────────
  api:
    name: API — typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate

      - name: Validate Prisma schema
        working-directory: services/api
        run: npx prisma validate

      - name: TypeScript typecheck
        working-directory: services/api
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: services/api
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: services/api/coverage/
          retention-days: 14

      - name: Build
        working-directory: services/api
        run: npm run build

  # ─── Vault: typecheck + build ─────────────────────────────────────────────
  vault:
    name: Vault — typecheck / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate API Prisma client (needed for workspace types)
        working-directory: services/api
        run: npx prisma generate --schema src/prisma/schema.prisma

      - name: Generate Prisma client (vault DB)
        working-directory: services/vault
        run: npx prisma generate --schema src/schema.prisma

      - name: TypeScript typecheck
        working-directory: services/vault
        run: npx tsc --noEmit

      - name: Build
        working-directory: services/vault
        run: npm run build

  # ─── Fraud engine: typecheck + build ─────────────────────────────────────
  fraud:
    name: Fraud — typecheck / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: TypeScript typecheck
        working-directory: services/fraud
        run: npx tsc --noEmit

      - name: Build
        working-directory: services/fraud
        run: npm run build

  # ─── Worker: typecheck ────────────────────────────────────────────────────
  worker:
    name: Worker — typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client (needed by worker imports)
        working-directory: services/api
        run: npx prisma generate

      - name: TypeScript typecheck
        working-directory: services/worker
        run: npx tsc --noEmit

  # ─── Admin frontend: typecheck + build ───────────────────────────────────
  admin-frontend:
    name: Admin — typecheck / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontends/admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontends/admin
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_TITLE: GiftCard Platform

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontends/admin/dist/
          retention-days: 3

  # ─── Cardholder frontend: typecheck + build ───────────────────────────────
  cardholder-frontend:
    name: Cardholder — typecheck / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontends/cardholder
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontends/cardholder
        run: npm run build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_API_BASE_URL: /api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardholder-dist
          path: frontends/cardholder/dist/
          retention-days: 3

  # ─── Schema migration safety check (PRs to main only) ────────────────────
  migrations:
    name: Prisma schema push (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: giftcard
          POSTGRES_PASSWORD: giftcard
          POSTGRES_DB: giftcard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://giftcard:giftcard@localhost:5432/giftcard_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate

      - name: Apply schema to CI database
        working-directory: services/api
        run: npx prisma db push --accept-data-loss

      - name: Verify schema is valid
        working-directory: services/api
        run: npx prisma validate

  # ─── Required gate ────────────────────────────────────────────────────────
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [api, vault, fraud, worker, admin-frontend, cardholder-frontend]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          jobs=("api" "vault" "fraud" "worker" "admin-frontend" "cardholder-frontend")
          results=("${{ needs.api.result }}" "${{ needs.vault.result }}" "${{ needs.fraud.result }}" "${{ needs.worker.result }}" "${{ needs.admin-frontend.result }}" "${{ needs.cardholder-frontend.result }}")
          failed=0
          for i in "${!jobs[@]}"; do
            if [[ "${results[$i]}" != "success" ]]; then
              echo "❌  ${jobs[$i]}: ${results[$i]}"
              failed=1
            else
              echo "✅  ${jobs[$i]}: success"
            fi
          done
          exit $failed
